name: Linux ARM64

on:
  push:
    branches: [main, linux/arm64, feat/xenia-nexus]
    paths:
      - 'emulator-core/src/main/cpp/xenia/**'
      - 'linux/**'
      - '.github/workflows/linux-arm64.yml'
  pull_request:
    paths:
      - 'emulator-core/src/main/cpp/xenia/**'
      - 'linux/**'
      - '.github/workflows/linux-arm64.yml'
  workflow_dispatch:

jobs:
  build-linux-arm64:
    name: Build Linux ARM64 (xenia-app)
    # Native aarch64 runner — xb/xenia-build.py rejects cross-compilation on
    # Linux, so we build on the real arch.  ubuntu-22.04-arm keeps the glibc
    # floor low for broader compatibility.
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache Slang
        id: cache-slang
        uses: actions/cache@v4
        with:
          path: emulator-core/src/main/cpp/xenia/.slang
          # Keep in sync with SLANG_VERSION in xenia-build.py.
          key: ${{ runner.os }}-${{ runner.arch }}-slang-2026.8

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: |
            ~/apt-archives
            ~/apt-lists
          key: ${{ runner.os }}-${{ runner.arch }}-apt-jammy-clang21-gcc14-v1

      - name: Setup toolchain and deps
        run: |
          UBUNTU_BASE=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository --no-update \
            "deb http://apt.llvm.org/${UBUNTU_BASE}/ llvm-toolchain-${UBUNTU_BASE}-21 main"
          sudo add-apt-repository -y --no-update ppa:ubuntu-toolchain-r/test

          sudo sed -i 's/ restricted//g' /etc/apt/sources.list

          printf '%s\n' \
            'APT::Keep-Downloaded-Packages "true";' \
            'Acquire::Languages "none";' \
            'Acquire::Retries "2";' \
            'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' \
            'Acquire::Check-Valid-Until "false";' \
            | sudo tee /etc/apt/apt.conf.d/99ci > /dev/null

          sudo cp -a ~/apt-lists/. /var/lib/apt/lists/ 2>/dev/null || true
          sudo chown -R root:root /var/lib/apt/lists
          sudo cp -n ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true

          sudo apt-get -y update
          sudo apt-get -y install --no-install-recommends \
            clang-21 lld-21 libclang-rt-21-dev llvm-21
          sudo apt-get -y install \
            g++-14 cmake ninja-build \
            libgtk-3-dev libx11-dev libx11-xcb-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev \
            libxfixes-dev libxtst-dev libfontconfig1-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libcurl4-openssl-dev

          rm -rf ~/apt-lists
          mkdir -p ~/apt-archives ~/apt-lists
          sudo cp -n /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
          sudo find /var/lib/apt/lists -maxdepth 1 -type f ! -name lock \
            -exec cp -a {} ~/apt-lists/ \;
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives ~/apt-lists

      - name: Fetch wxWidgets files missing from Xendroid tree
        # Xendroid commits wxWidgets source but omits build/ and several
        # include/wx/*/private/ dirs (Android never needs them).  Fetch both
        # from the upstream v3.3.2 tag. --filter=blob:none + sparse-checkout
        # keeps the clone lightweight (headers + CMake scripts only).
        run: |
          wx_dir="emulator-core/src/main/cpp/xenia/third_party/wxWidgets"
          git clone --filter=blob:none --no-checkout \
            https://github.com/wxWidgets/wxWidgets.git wx_tmp
          cd wx_tmp
          git sparse-checkout init --cone
          git sparse-checkout set build include
          git checkout v3.3.2
          cd ..
          cp -r wx_tmp/build "${wx_dir}/build"
          cp -rn wx_tmp/include/. "${wx_dir}/include/"
          rm -rf wx_tmp

      - name: Download Slang
        if: steps.cache-slang.outputs.cache-hit != 'true'
        working-directory: emulator-core/src/main/cpp/xenia
        run: python3 ./xenia-build.py slang

      - name: Setup sccache
        id: setup-sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure
        # Run cmake configure manually so we can inject zerofg_inject.cmake via
        # CMAKE_PROJECT_INCLUDE. xenia-build.py's -- passthrough only reaches
        # cmake --build, not cmake configure.
        working-directory: emulator-core/src/main/cpp/xenia
        env:
          CC: clang-21
          CXX: clang++-21
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake -S . -B build -G "Ninja Multi-Config" \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_PROJECT_xenia_INCLUDE="${GITHUB_WORKSPACE}/linux/zerofg_inject.cmake"

      - name: Build
        working-directory: emulator-core/src/main/cpp/xenia
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: python3 ./xenia-build.py build --config=Release --no_configure

      - name: sccache stats
        if: always() && steps.setup-sccache.outcome == 'success'
        run: sccache --show-stats

      - name: Cache linuxdeploy tools
        id: cache-linuxdeploy
        uses: actions/cache@v4
        with:
          path: ~/linuxdeploy
          key: ${{ runner.os }}-${{ runner.arch }}-linuxdeploy-tools

      - name: Download linuxdeploy
        if: steps.cache-linuxdeploy.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage \
            -O ~/linuxdeploy/linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-aarch64.AppImage \
            -O ~/linuxdeploy/linuxdeploy-plugin-appimage
          chmod +x ~/linuxdeploy/linuxdeploy ~/linuxdeploy/linuxdeploy-plugin-appimage
          echo "$HOME/linuxdeploy" >> $GITHUB_PATH

      - name: Add linuxdeploy to PATH
        if: steps.cache-linuxdeploy.outputs.cache-hit == 'true'
        run: echo "$HOME/linuxdeploy" >> $GITHUB_PATH

      - name: Build Xenia Nexus launcher
        env:
          CC: clang-21
          CMAKE_C_COMPILER_LAUNCHER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake -S linux/nexus -B linux/nexus/build \
            -G "Ninja Multi-Config" \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache
          cmake --build linux/nexus/build --config Release
          nexus_bin=linux/nexus/build/Release/xenia-nexus
          if [ ! -f "$nexus_bin" ]; then
            # Fallback: Ninja Multi-Config may put it without sub-directory
            nexus_bin=$(find linux/nexus/build -name "xenia-nexus" -type f | head -n1)
          fi
          if [ -z "$nexus_bin" ] || [ ! -f "$nexus_bin" ]; then
            echo "::error::xenia-nexus binary not found after build"
            find linux/nexus/build -type f -name "xenia*" || true
            exit 1
          fi
          echo "NEXUS_BIN=$nexus_bin" >> $GITHUB_ENV

      - name: Build XeniaNexus AppImage
        run: |
          xenia_bin=emulator-core/src/main/cpp/xenia/build/bin/Linux/Release/xenia_edge
          nexus_bin=$NEXUS_BIN

          for f in "$xenia_bin" "$nexus_bin"; do
            if [ ! -f "$f" ]; then
              echo "::error::binary not found: $f"; exit 1
            fi
            if ! file "$f" | grep -q "aarch64"; then
              echo "::error::$f is not an aarch64 binary"; file "$f"; exit 1
            fi
          done

          strip --strip-debug "$xenia_bin" "$nexus_bin"

          # --- Assemble the unified AppDir ---
          APPDIR=artifacts/xenia_nexus

          # Nexus icons
          for size in 16 32 48 64 128 256 512 1024; do
            mkdir -p "${APPDIR}/usr/share/icons/hicolor/${size}x${size}/apps"
            cp "linux/nexus/assets/icon/${size}.png" \
               "${APPDIR}/usr/share/icons/hicolor/${size}x${size}/apps/xenia-nexus.png"
          done

          # Fonts: beside the launcher binary at usr/bin/fonts/ so cfg_exe_dir()
          # (which returns the directory of the running binary) finds them.
          # linux/nexus/ui/fonts/ ships Play (OFL) as Phase 1 fallback;
          # Selawik will replace it once added to that directory.
          mkdir -p "${APPDIR}/usr/bin/fonts"
          cp linux/nexus/ui/fonts/*.ttf "${APPDIR}/usr/bin/fonts/"

          # Step 1: let linuxdeploy assemble the AppDir (no --output yet).
          # Both binaries end up in usr/bin/; libs are bundled.
          linuxdeploy --appdir "$APPDIR" \
            --executable "$xenia_bin" \
            --executable "$nexus_bin" \
            --desktop-file linux/nexus/assets/xenia-nexus.desktop \
            --icon-file linux/nexus/assets/icon/256.png

          # Step 2: install our custom AppRun routing script.
          # linuxdeploy creates AppRun as a SYMLINK -> usr/bin/xenia-nexus (the
          # desktop file's Exec name).  A plain cp follows the symlink and
          # overwrites the real launcher ELF with the routing script, leaving
          # usr/bin/xenia-nexus as a shell script that execs itself — infinite
          # loop, blank screen on the Odin.  Remove the symlink first so we
          # write a real file and leave the ELF at usr/bin/xenia-nexus intact.
          rm -f "${APPDIR}/AppRun"
          cp linux/nexus/assets/AppRun "${APPDIR}/AppRun"
          chmod +x "${APPDIR}/AppRun"
          # Sanity: launcher ELF must not have been clobbered.
          file "${APPDIR}/usr/bin/xenia-nexus" | grep -q ELF \
            || { echo "::error::usr/bin/xenia-nexus is not an ELF — clobbered by AppRun cp"; exit 1; }

          # Step 3: squash the AppDir into an AppImage.
          ARCH=aarch64 linuxdeploy-plugin-appimage --appdir "$APPDIR"

          appimage_file=$(ls -1 *.AppImage | head -n1)
          mkdir -p artifacts/release
          mv "$appimage_file" artifacts/release/XeniaNexus-arm64.AppImage
          chmod +x artifacts/release/XeniaNexus-arm64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xenia-app-linux-arm64
          path: artifacts/release/XeniaNexus-arm64.AppImage
          if-no-files-found: error
